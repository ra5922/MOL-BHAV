<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mol Bhav — Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #11172E;
}
  /* ============================================================
     YOUR EXACT ORIGINAL CSS
     ============================================================ */
  :root{
    --bg-deep:#1E2438;
    --bg-deep-2:#141828;
    --paper:#F4ECDC;
    --paper-edge:#E1D2B2;
    --ink:#11172E;
    --muted:#767C8C;
    --turmeric:#B8923C;
    --turmeric-dark:#8F6E28;
    --brick:#A6472E;
    --paan:#55754A;
    --indigo-a:#3B4A6B;
    --indigo-a-dark:#28314C;
    --plum:#6B4A63;
    --terracotta:#92564A;
    --terracotta-dark:#7A4740;
    --them-bubble:#B8923C ;
    --them-bubble-text:#302B25;
    --brief-them-bg:#F5F5F5; /* Gray for Landlord */
    --brief-them-text:#111111;
    --brief-you-bg:#F8D299;  /* Yellow for You */
    --brief-you-bg-dark:#F0C070;
    --brief-you-text:#111111;
    --info-surface:#F4EFE5;
    --soft-divider:#E8DFD1;
    --diff-easy-bg:#E7EFE5;   --diff-easy-text:#567052;
    --diff-medium-bg:#F5EAD3; --diff-medium-text:#916A22;
    --diff-hard-bg:#F2E2DE;   --diff-hard-text:#99594E;
    --home-1:#11172E;
    --home-2:#3B3561;
    --card-white:#FCFAF5;
    --navy-play:#1E2447;
    /* CHANGED: All text is now pure white */
    --on-dark: #FFFFFF; 
    --on-dark-soft: #FFFFFF;
    --on-dark-faint: #FFFFFF;
  }
  *{ box-sizing:border-box; }
  button{ -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(217,164,65,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(166,71,46,0.12), transparent 45%),
      linear-gradient(160deg, var(--bg-deep), var(--bg-deep-2));
    font-family:'Manrope', sans-serif; color:var(--ink); padding:24px 12px;
  }
  .phone{
    width:min(420px,100%); min-height:680px; height:92vh; max-height:920px;
    background: linear-gradient(180deg, var(--home-1) 0%, var(--home-1) 68%, var(--home-2) 100%); 
    border-radius:26px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.4) inset;
    padding:20px 18px; display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  @media (min-width:1100px){ .phone{ width:min(440px,100%); } }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(4px);} }
  .phone.shake{ animation:shake .5s ease; }
  @keyframes briefIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .chat-header-bar, .brief-convo .convo-block, .brief-goal, .brief-caption, #startBtn{
    animation: briefIn .5s ease both;
  }
  .chat-header-bar{ animation-delay:.02s; }
  .brief-convo .convo-block.them{ animation-delay:.10s; }
  .brief-convo .convo-block.you{ animation-delay:.18s; }
  .brief-goal{ animation-delay:.24s; }
  .brief-caption{ animation-delay:.30s; }
  #startBtn{ animation-delay:.42s; }

  .screen{ display:none; flex-direction:column; flex:1; min-height:0; }
  .screen.active{ display:flex; animation:fadeUp .45s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* CHANGED: Back button is pure white */
  .back-btn{ background:none; border:none; font-family:'Manrope', sans-serif; font-weight:700; font-size:13px; color:#FFFFFF; cursor:pointer; align-self:flex-start; margin-bottom:6px; padding:4px 0; display:inline-flex; align-items:center; gap:4px; }
  .back-btn:hover{ color:#FFFFFF; opacity: 0.8; }
  .back-btn.small{ font-size:18px; padding:2px 8px; }
  .sound-toggle{ background:none; border:none; font-size:17px; cursor:pointer; padding:2px 4px; opacity:0.75; }
  .sound-toggle:hover{ opacity:1; }

  #screen-briefing{
    margin:-20px -18px;
    padding:20px 18px 18px;
    border-radius:26px;
    position:relative;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:none;
  }
  #screen-briefing::-webkit-scrollbar{ width:0; height:0; }

  #screen-briefing .back-btn{
    color:#FFFFFF; /* Pure White */
    font-weight:700; font-size:13px; letter-spacing:0.2px;
    margin-bottom:14px;
    transition:color .2s ease, transform .2s ease;
  }
  #screen-briefing .back-btn:hover{ color:#FFFFFF; opacity: 0.8; transform:translateX(-2px); }

  .brief-kicker{
    font-family:'Manrope', sans-serif;
    font-size:10px; font-weight:800;
    letter-spacing:1.8px; text-transform:uppercase;
    color:#FFFFFF; /* Pure White */
    margin:2px 0 12px;
  }

  .chat-header-bar{
    display:flex; align-items:center; gap:12px;
    margin:0 0 28px;
  }
  .chat-header-bar .convo-avatar{
    width:50px; height:50px; font-size:22px; flex-shrink:0;
  }
  .chat-header-meta{ min-width:0; }
  .chat-header-name{
    font-family:'Manrope', sans-serif;
    font-weight:800; font-size:16.5px;
    color:#FFFFFF; /* Pure White */
    line-height:1.2;
  }
  .chat-header-sub{
    font-family:'Manrope', sans-serif;
    font-weight:600; font-size:12.5px;
    color:#FFFFFF; /* Pure White */
    line-height:1.3; margin-top:2px;
  }

  .brief-convo{
    display:flex; flex-direction:column; gap:16px;
    margin-bottom:22px; position:relative; z-index:1;
  }
  .convo-block{
    display:flex; flex-direction:column; gap:6px;
    max-width:86%;
  }
  .convo-block.them{ align-self:flex-start; }
  .convo-block.you{ align-self:flex-end; align-items:flex-end; }
  
  /* CHANGED: Label is pure white */
  .convo-label{
    font-family:'Manrope', sans-serif;
    font-size:9px; font-weight:800;
    letter-spacing:1.6px; text-transform:uppercase;
    color:#FFFFFF; /* Pure White */
    padding:0 6px;
  }
  .convo-avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
  }
  .convo-avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .convo-block.you .convo-label{ color:#FFFFFF; /* Pure White */ }
  
  .convo-bubble{
    padding:12px 16px;
    font-family:'Manrope', sans-serif;
    font-size:14.5px; line-height:1.5; font-weight:500;
    border-radius:18px;
  }
  
  /* BUBBLE COLORS (Text inside remains black for readability) */
  /* LANDLORD BUBBLE (Gray) */
  .convo-bubble.them{
    background:#F5F5F5; /* Gray */
    color:#111111;      /* Black */
    border-bottom-left-radius:5px;
  }
  /* YOU BUBBLE (Yellow) */
  .convo-bubble.you{
    background:#F8D299; /* Yellow */
    color:#111111;      /* Black */
    border-bottom-right-radius:5px;
    box-shadow:0 6px 16px rgba(0,0,0,0.10);
  }

  /* CHANGED: Timestamp is pure white */
  .convo-timestamp{
    font-family:'Manrope', sans-serif;
    font-size:10.5px; font-weight:600;
    color:#FFFFFF; /* Pure White */
    padding:0 6px;
  }

  .brief-goal{ margin:0 0 16px; }
  .brief-goal-label{
    display:block;
    font-family:'Manrope', sans-serif;
    font-size:10px; font-weight:800;
    letter-spacing:1.6px; text-transform:uppercase;
    color:#FFFFFF; /* Pure White */
    margin-bottom:6px;
  }
  .brief-note{
    font-family:'Manrope', sans-serif;
    font-size:13px; line-height:1.55; font-weight:500;
    color:#FFFFFF; /* Pure White */
    margin:0; padding:0 2px; max-width:96%;
  }

  .brief-info-row{
    display:flex;
    justify-content:space-between;
    margin:0 0 6px; padding:0 2px;
  }
  .brief-info-item{
    flex:1 1 0;
    display:flex; flex-direction:column; gap:5px;
  }
  .brief-info-item:first-child{ align-items:flex-start; text-align:left; }
  .brief-info-item:nth-child(2){ align-items:center; text-align:center; }
  .brief-info-item:last-child{ align-items:flex-end; text-align:right; }
  .brief-info-item{ display:flex; flex-direction:column; gap:5px; }
  .brief-info-label{
    font-family:'Manrope', sans-serif;
    font-size:9.5px; font-weight:800;
    letter-spacing:1.1px; text-transform:uppercase;
    color:#FFFFFF; /* Pure White */
    white-space:nowrap;
  }
  .brief-info-value{
    font-family:'Manrope', sans-serif;
    font-size:15px; font-weight:800;
    color:#FFFFFF; /* Pure White */
    white-space:nowrap;
  }

  .diff-pill{
    display:inline-block;
    font-family:'Manrope', sans-serif;
    font-size:10.5px; font-weight:800;
    letter-spacing:0.3px;
    padding:2px 10px; border-radius:20px; line-height:1.6;
  }
  .diff-pill.diff-easy{   background:#F5F5F5; color:#111111; }
  .diff-pill.diff-medium{ background:#F8D299;   color:#111111; }
  .diff-pill.diff-hard{   background:#111111;   color:#FFFFFF; }

  #startBtn{
    width:100%;
    margin-top:auto;
    padding:16px 22px;
    border-radius:18px;
    border:none;
    background:#F8D299; /* Yellow */
    color:#111111;      /* Black */
    font-family:'Manrope', sans-serif;
    font-weight:800; font-size:15px; letter-spacing:0.2px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    cursor:pointer; flex-shrink:0;
    box-shadow:0 12px 26px rgba(0,0,0,0.28);
    transition:transform .18s ease, box-shadow .25s ease, background .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #startBtn:hover{
    background:#E5B86E;
    box-shadow:0 16px 32px rgba(0,0,0,0.32);
  }
  #startBtn:active{ transform:scale(0.985); background:#E5B86E; }
  #startBtn:focus-visible{ outline:2px solid #111111; outline-offset:3px; }
  #startBtn .arrow{
    display:inline-block; font-weight:500;
    transition:transform .25s cubic-bezier(.34,1.4,.64,1);
  }
  #startBtn:hover .arrow{ transform:translateX(4px); }

  @media (max-width:480px){
    html, body{
      margin:0; padding:0; width:100%; height:100%;
      overflow:hidden;
      background: linear-gradient(180deg, var(--home-1) 0%, var(--home-1) 68%, var(--home-2) 100%);
    }
    .phone{
      position:fixed; inset:0;
      width:100%; height:100%; height:100dvh;
      padding:0; border-radius:0; box-shadow:none;
    }
    #screen-briefing{
      margin:0;
      padding:calc(16px + env(safe-area-inset-top, 0px)) 14px calc(16px + env(safe-area-inset-bottom, 0px));
      border-radius:0;
    }
    .chat-header-name{ font-size:15.5px; }
    .chat-header-sub{ font-size:12px; }
    .brief-info-row{ gap:20px; }
    .convo-block{ max-width:90%; }
    .brief-note{ font-size:12.5px; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <section id="screen-briefing" class="screen active">
    <button class="back-btn" id="backFromBriefing" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 L9 12 L15 18"/></svg>
      <span>Back</span>
    </button>

    <div class="brief-kicker" id="briefTag"></div>

    <div class="chat-header-bar">
      <span class="convo-avatar" id="briefAvatar">
        <img id="briefAvatarImg" alt="" style="display:none;">
        <span id="briefAvatarEmoji">🙂</span>
      </span>
      <div class="chat-header-meta">
        <div class="chat-header-name" id="briefRoleLabel">Seller</div>
        <div class="chat-header-sub" id="briefTitle"></div>
      </div>
    </div>

    <div class="brief-convo">
      <div class="convo-block them">
        <div class="convo-bubble them" id="briefOwnerBubble"></div>
      </div>
      <div class="convo-block you">
        <span class="convo-label">You</span>
        <div class="convo-bubble you" id="briefYouBubble"></div>
        <span class="convo-timestamp">Just now</span>
      </div>
    </div>

    <div class="brief-goal">
      <span class="brief-goal-label">Your goal</span>
      <p class="brief-note">Find a number that works for both of you — and leave them glad they dealt with you.</p>
    </div>

    <div class="brief-info-row">
      <div class="brief-info-item">
        <span class="brief-info-label">Starting gap</span>
        <span class="brief-info-value" id="briefGap"></span>
      </div>
      <div class="brief-info-item">
        <span class="brief-info-label">Rounds</span>
        <span class="brief-info-value">5–7</span>
      </div>
      <div class="brief-info-item">
        <span class="brief-info-label">Difficulty</span>
        <span class="diff-pill" id="briefDiff"></span>
      </div>
    </div>

    <button class="primary-btn" id="startBtn">
      <span>Start negotiating</span>
      <span class="arrow">→</span>
    </button>
  </section>
</div>

  function getDailyScenarioKey(){

    const d = new Date();
    const seed = d.getFullYear()*372 + (d.getMonth()+1)*31 + d.getDate();
    return keys[seed % keys.length];
  }

    SCENARIOS[key].imageUrl = SCENARIO_IMAGES[key] || '';
  });
  
  function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return '₹' + Math.round(n).toLocaleString('en-IN'); }

  function loadBriefing() {
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get('scenario') || 'rent';
    const sc = SCENARIOS[key];

    const titleParts = sc.title.split(' · ');
    document.getElementById('briefTag').textContent = titleParts[0] || sc.title;
    document.getElementById('briefTitle').textContent = titleParts[1] || '';
    document.getElementById('briefRoleLabel').textContent = sc.roleLabel;
    
    const mockAsk = sc.askMin;
    const mockOffer = sc.offerMax;
    
    const askFmt = fmt(mockAsk);
    const offerFmt = fmt(mockOffer);
    const ownerText = sc.openingOwnerTemplate.replace(/\{ask\}/g, askFmt).replace(/\{offer\}/g, offerFmt);
    const playerText = sc.openingPlayerTemplate.replace(/\{ask\}/g, askFmt).replace(/\{offer\}/g, offerFmt);

    document.getElementById('briefOwnerBubble').textContent = ownerText;
    document.getElementById('briefYouBubble').textContent = playerText;
    document.getElementById('briefGap').textContent = fmt(Math.abs(mockAsk - mockOffer));
    
    const diffEl = document.getElementById('briefDiff');
    diffEl.textContent = 'Medium';
    diffEl.className = 'diff-pill diff-medium';

    const avatarEmoji = document.getElementById('briefAvatarEmoji');
    const avatarEl = document.getElementById('briefAvatar');
    avatarEmoji.textContent = sc.icon || '🙂';
    avatarEl.style.background = '#FCFAF5';
    avatarEl.style.boxShadow = '0 0 0 2px #E1D2B2, inset 0 -3px 6px rgba(0,0,0,0.06)';

    document.getElementById('startBtn').onclick = function() {
      window.location.href = 'negotiate.html?scenario=' + key;
    };
  }
